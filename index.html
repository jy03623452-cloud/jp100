<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日语口语100句 · N3-N2</title>
<meta name="theme-color" content="#c8412d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日语100句">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f6f2ea; --card:#fffdf8; --ink:#24211d; --sub:#6d665c; --line:#e6dfd2;
  --red:#c8412d; --red-soft:#fbe7e2; --pt:#d9601f; --pt-bg:#fde9d9;
  --green:#2f7d5b; --green-soft:#e1f1e8; --blue:#2f5f8f; --blue-soft:#e3edf7;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1b1a18;--card:#252320;--ink:#efe9df;--sub:#a59d90;--line:#3a3631;
  --red:#e2664f;--red-soft:#3d2620;--pt:#f0894a;--pt-bg:#3d2a1c;--green:#5cbf8f;--green-soft:#1f3329;--blue:#7fb0e0;--blue-soft:#1e2c3a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans","Noto Sans SC","Noto Sans JP","Microsoft YaHei",system-ui,sans-serif;font-size:16px;line-height:1.6}
.jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","PingFang SC",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#top .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;min-height:52px}
#back{font-size:22px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
#back:active{background:var(--line)}
#title{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#furi{font-size:13px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--sub)}
#furi.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:680px;margin:0 auto;padding:14px 14px 90px}
.hero{padding:18px 4px 8px}
.hero h1{font-family:"Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",serif;font-size:28px;margin:0;letter-spacing:1px}
.hero h1 span{color:var(--red)}
.hero p{color:var(--sub);margin:6px 0 0;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--red);border-radius:8px;transition:width .4s}
.stat{font-size:13px;color:var(--sub);display:flex;justify-content:space-between}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.qbtn{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left}
.qbtn b{display:block;font-size:15px}.qbtn small{color:var(--sub);font-size:12px}
.qbtn.main{background:var(--red);color:#fff;border-color:var(--red)}.qbtn.main small{color:#ffe5df}
h2.sec{font-size:14px;color:var(--sub);font-weight:500;margin:22px 4px 10px;letter-spacing:1px}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;position:relative}
.scene .ic{font-size:24px}.scene b{display:block;font-size:15px;margin-top:4px}
.scene small{color:var(--sub);font-size:12px}
.dots{display:flex;gap:3px;margin-top:8px}.dots i{width:100%;height:4px;border-radius:2px;background:var(--line)}
.dots i.s1{background:#e8b04a}.dots i.s2{background:var(--green)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:center}
.item .no{font-size:12px;color:var(--sub);width:26px;flex:none;text-align:center}
.item .tx{flex:1;min-width:0}.item .tx .jp{font-size:16px;font-weight:500}.item .tx small{color:var(--sub);font-size:13px;display:block}
.st{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}.st.s1{background:#e8b04a}.st.s2{background:var(--green)}
.legend{font-size:12px;color:var(--sub);display:flex;gap:14px;margin:4px 4px 12px}.legend span{display:flex;align-items:center;gap:5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.big{font-size:24px;line-height:2.1;font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.big ruby rt{font-size:11px;color:var(--sub);font-weight:400}
.hidefuri rt{visibility:hidden}
.pt{color:var(--pt);font-weight:700}
.zh{color:var(--sub);font-size:15px;margin-top:4px}
.tabs{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;white-space:nowrap;padding:9px 6px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--sub)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn.ghost{border-style:dashed}
.btn:disabled{opacity:.5}
.play{display:inline-flex;align-items:center;gap:4px}
.lbl{font-size:12px;color:var(--sub);letter-spacing:1px;margin-bottom:6px;font-weight:500}
.parts{display:flex;flex-direction:column;gap:2px}
.part{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.part:last-child{border:none}
.part .w{flex:none;min-width:34%;font-size:17px}
.part .w ruby rt{font-size:10px;color:var(--sub)}
.part .g{font-size:14px;color:var(--ink)}
.part.isp .w{color:var(--pt);font-weight:700}
.part.isp .g{color:var(--pt)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--pt-bg);color:var(--pt);margin-right:4px;vertical-align:1px}
.pattern{display:inline-block;background:var(--blue-soft);color:var(--blue);padding:4px 10px;border-radius:8px;font-weight:500;margin-bottom:8px}
.expl{font-size:15px;line-height:1.75}
.tip{background:var(--red-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.shadow{display:flex;gap:6px;margin-top:10px}
.shadow i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.shadow i.on{background:var(--green);border-color:var(--green)}
.pool,.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:12px}
.answer{border:2px dashed var(--line);margin-bottom:10px;background:var(--bg)}
.chip{padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:17px;box-shadow:0 1px 0 var(--line)}
.chip.isp{color:var(--pt);border-color:var(--pt);background:var(--pt-bg);font-weight:700}
.chip.bad{outline:2px solid var(--red)}
.result{border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px}
.result.good{background:var(--green-soft)}.result.bad{background:var(--red-soft)}.result.mid{background:#fdf3d7;color:#4a3b10}
textarea{width:100%;font:inherit;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","PingFang SC",sans-serif;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;min-height:70px}
textarea:focus{outline:2px solid var(--blue);border-color:transparent}
.hint{font-size:12px;color:var(--sub);margin:6px 0 10px}
.mic{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:19px;flex:none}
.recbtn.live,.mic.live{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--red) 25%,transparent)}}
.drill{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--bg)}
.drill .q{font-size:15px}
.drill .a{margin-top:8px;font-size:18px;display:none}
.drill.open .a{display:flex;gap:8px;align-items:center}
.drill .tap{font-size:12px;color:var(--blue)}
.ai{border:1px solid var(--blue);background:var(--blue-soft);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ai h3{margin:0 0 6px;font-size:15px;color:var(--blue)}
.fb ul{margin:6px 0;padding-left:20px}.fb li{margin:3px 0}
.fb .corr{font-size:18px;font-weight:500;margin:4px 0}
.score{font-weight:700;font-size:20px}
.foot{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
.foot .in{max-width:680px;margin:0 auto;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.foot .btn{flex:1;text-align:center}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.bub{max-width:88%;padding:10px 13px;border-radius:14px;font-size:16px}
.bub.c{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bub.u{background:var(--ink);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px}
.bub .rd{font-size:12px;color:var(--sub)}.bub .tr{font-size:13px;color:var(--sub);margin-top:4px}
.fbk{align-self:flex-end;max-width:88%;background:#fdf3d7;color:#4a3b10;border-radius:12px;padding:8px 12px;font-size:13px}
.fbk b{font-size:15px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--sub);font-size:13px}
.guide h3{font-size:16px;margin:0 0 6px}.guide p{margin:0;font-size:15px}
.guide .ex{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","PingFang SC",sans-serif;background:var(--bg);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:15px}
.revcard{text-align:center;padding:28px 16px}
.revcard .zhq{font-size:21px;font-weight:500;margin-bottom:6px}
.prog{font-size:13px;color:var(--sub);text-align:center;margin-bottom:8px}
.diff ins{text-decoration:none;background:var(--red-soft);color:var(--red);border-radius:3px}
</style>
</head>
<body>
<div id="top"><div class="in"><button id="back" aria-label="返回">‹</button><div id="title">日语口语100句</div><button id="furi">假名</button></div></div>
<main id="app"></main>
<div class="foot" id="foot" style="display:none"><div class="in" id="footIn"></div></div>
<script>
const SCENES = [
  {name:"寒暄与人际", icon:"👋", role:"学生在日本认识多年的日本朋友（比学生年长，说话亲切）"},
  {name:"自我介绍与经历", icon:"🙋", role:"在交流会上第一次见面的日本人，对学生的经历很好奇，会追问细节"},
  {name:"请求与拜托", icon:"🙏", role:"学生公司里的日本前辈，学生需要向你拜托几件事"},
  {name:"购物与售后", icon:"🛍️", role:"电器店的店员，学生来咨询商品和售后问题"},
  {name:"餐厅与聚会", icon:"🍶", role:"一起参加公司聚餐的日本同事"},
  {name:"交通与出行", icon:"🚄", role:"和学生约好一起出游的日本朋友，学生在路上遇到了交通问题"},
  {name:"职场沟通", icon:"💼", role:"学生公司的课长，正在听学生汇报项目进展，说话用敬语和商务用语"},
  {name:"意见与感受", icon:"💭", role:"学生的日本好友，你们在咖啡店深聊工作和人生"},
  {name:"计划与约定", icon:"📅", role:"学生的日本朋友，你们在商量周末去京都旅行的计划"},
  {name:"生活与麻烦", icon:"🏠", role:"区役所或公寓管理公司的工作人员，学生来反映生活中遇到的麻烦"}
];

// 字段: j=日语  z=中文  p=拆解(词(读音)|说明; *开头=助词)  t=句型  e=讲解  d=举一反三(日=中;…)
const S = [
// ── 1 寒暄与人际
{j:"先日はお忙しいところ、わざわざ来ていただいて、本当にありがとうございました。",z:"前几天您百忙之中还特意过来，真的非常感谢。",
p:"先日(せんじつ)|前几天;*は|话题;お忙しい(おいそがしい)|您很忙（尊敬）;ところ|…之时（お忙しいところ＝百忙之中）;わざわざ|特意;来て(きて)|来る的て形;いただいて|いただく的て形：承蒙您…（表原因）;本当に(ほんとうに)|真的;ありがとうございました|谢谢",
t:"お忙しいところ／〜ていただいて、ありがとうございました",
e:"一句话里有三层意思：①您很忙（お忙しいところ）②您还特意来了（わざわざ来ていただいて）③我很感谢。「〜ていただいて」的て形在这里表示感谢的原因，日本人感谢时总是先说“您为我做了什么”，最后才说「ありがとう」。「ところ」接在状态后面表示“在您…的时候”，常见：お忙しいところ、お休みのところ、遠いところ。",
d:"お忙しいところ、すぐにお返事をいただいて、助かりました。=您百忙之中还马上回复，帮了大忙。;遠いところ、わざわざお越しいただいて、恐縮です。=您大老远特意过来，真是过意不去。;お休みのところ、お電話してしまって、申し訳ありません。=在您休息时打电话，真是抱歉。"},
{j:"最近なかなか会えなかったけど、元気そうで安心したよ。",z:"最近一直没能见面，看你挺精神的我就放心了。",
p:"最近(さいきん)|最近;なかなか|（接否定）怎么也不…;会えなかった(あえなかった)|会う的可能形否定过去;*けど|虽然…但是;元気(げんき)|有精神;そう|看起来（样态）;*で|て形：表示原因;安心した(あんしんした)|放心了;*よ|告知语气",
t:"なかなか〜ない／〜そうで安心した",
e:"前半句说情况（一直没见面），后半句说感受（看你很好我就放心了），用「けど」连接。「なかなか＋否定」＝想做却一直做不到，比「全然」更带着“遗憾”的感觉。「元気そうで」：そう表示“看起来”，で表示原因，“因为看起来很好，所以放心”。朋友之间用普通形＋「よ」，很自然。",
d:"忙しそうだったけど、楽しそうで安心しました。=看你好像挺忙，但看起来很开心，就放心了。;なかなか連絡できなくて、ごめんね。=一直没能联系你，抱歉啊。;思ったより元気そうで、ほっとしました。=比想象的有精神，松了一口气。"},
{j:"引っ越しの時に手伝ってもらったお礼に、今度ご飯でもごちそうさせてください。",z:"作为你帮我搬家的谢礼，下次让我请你吃顿饭吧。",
p:"引っ越し(ひっこし)|搬家;*の|的;時(とき)|时候;*に|时间点;手伝って(てつだって)|帮忙;もらった|てもらう的过去：得到了帮助;お礼(おれい)|谢礼;*に|作为（目的）;今度(こんど)|下次;ご飯(ごはん)|饭;でも|…之类的（委婉举例）;ごちそうさせて|ごちそうする的使役て形：让我请客;ください|请",
t:"〜てもらったお礼に／〜させてください",
e:"语序关键：日语的修饰语全部放在名词前面。「引っ越しの時に手伝ってもらった」这一长串整体修饰「お礼」——“搬家时得到帮助的谢礼”。「〜に」表示“作为…”。「させてください」＝请让我做，比「ごちそうします」更谦虚，是请客时的固定说法。「ご飯でも」的「でも」让邀请不那么强硬。",
d:"傘を貸してもらったお礼に、お菓子を持ってきました。=作为借我伞的谢礼，带了些点心来。;いつもお世話になっているお礼に、プレゼントを用意しました。=为了感谢一直以来的照顾，准备了礼物。;今回は私に払わせてください。=这次请让我来付吧。"},
{j:"せっかく誘ってもらったのに、急な仕事が入ってしまって、行けそうにないんです。",z:"难得你约我，可是突然来了工作，看来去不了了。",
p:"せっかく|难得;誘って(さそって)|邀请;もらった|得到了;*のに|却（遗憾）;急な(きゅうな)|突然的;仕事(しごと)|工作;*が|主语;入って(はいって)|（工作）安排进来;しまって|てしまう：遗憾;行け(いけ)|行く的可能形;そうにない|看样子不能;んです|解释情况",
t:"せっかく〜のに／〜そうにない",
e:"拒绝邀约的高级说法，三步：①感谢对方的好意（せっかく誘ってもらったのに）②说明理由（急な仕事が入ってしまって）③委婉地说结果（行けそうにない）。「せっかく〜のに」表示“难得…却…”的惋惜。「〜そうにない」比「行けません」委婉，意思是“看样子去不成”。",
d:"せっかく作ったのに、誰も食べてくれなかった。=难得做了，却没人吃。;せっかくの休みなのに、雨で出かけられなかった。=难得的休息日，却因为下雨没能出门。;今日中には終わりそうにないです。=看样子今天之内做不完。"},
{j:"あの時、先輩が相談に乗ってくれなかったら、今の私はなかったと思います。",z:"那时如果不是前辈听我倾诉、给我出主意，就没有现在的我。",
p:"あの|那;時(とき)|时候;先輩(せんぱい)|前辈;*が|主语;相談(そうだん)|商量;*に|对象;乗って(のって)|相談に乗る＝听人倾诉、出主意;くれなかったら|如果没有为我…;今(いま)|现在;*の|的;私(わたし)|我;*は|话题;なかった|不存在（过去）;*と|引用;思います(おもいます)|觉得",
t:"〜てくれなかったら、〜なかった（与事实相反的假设）",
e:"用“如果当时没有…就不会…”来表达深深的感谢。「〜たら」接过去的事，就是与事实相反的假设。「相談に乗る」是固定搭配，助词必须用「に」。「くれる」表示对方为我做，带着感激。",
d:"あの本に出会わなかったら、日本に来ることはなかったでしょう。=如果没遇到那本书，我大概不会来日本。;友達が教えてくれなかったら、間に合わなかったと思います。=要不是朋友告诉我，我想就赶不上了。;あなたがいなかったら、どうなっていたか分かりません。=如果没有你，真不知道会怎么样。"},
{j:"お返事が遅くなってしまって申し訳ないんですが、ご結婚、本当におめでとうございます。",z:"回复晚了真不好意思，衷心恭喜你结婚。",
p:"お返事(おへんじ)|回复;*が|主语;遅く(おそく)|晚;なって|变得;しまって|てしまう：遗憾;申し訳ない(もうしわけない)|抱歉;んですが|铺垫后接正题;ご結婚(ごけっこん)|结婚（尊敬）;本当に(ほんとうに)|真的;おめでとうございます|恭喜",
t:"〜てしまって申し訳ないんですが、〜",
e:"先道歉再进入正题，是日语邮件和LINE的典型结构。「〜てしまって」表示“不小心变成这样，很遗憾”，后面直接接「申し訳ない」表示道歉的原因。「んですが」把前后两件事柔和地连接起来。说对方的事加「ご」：ご結婚、ご出産、ご入学。",
d:"連絡が遅くなってしまって申し訳ないんですが、来週の件、参加します。=联系晚了很抱歉，下周的事我参加。;夜分に申し訳ないんですが、少しだけお時間いいですか。=深夜打扰很抱歉，能占用您一点时间吗？;ご出産、本当におめでとうございます。=衷心恭喜您生了宝宝。"},
{j:"長い間お世話になったので、引っ越す前にきちんとご挨拶に伺いたいと思っています。",z:"承蒙您长期关照，所以想在搬家前好好登门道别。",
p:"長い間(ながいあいだ)|长期;お世話(おせわ)|照顾;*に|从…受到;なった|なる的过去;*ので|因为;引っ越す(ひっこす)|搬家;前(まえ)|之前;*に|时间点;きちんと|好好地、正式地;ご挨拶(ごあいさつ)|问候、道别;*に|目的：去做…;伺いたい(うかがいたい)|想拜访（谦让语）;*と|引用;思っています(おもっています)|一直这么想",
t:"辞书形＋前に／名词＋に伺う／〜たいと思っています",
e:"「辞书形＋前に」＝在做…之前（注意用辞书形，不用た形）。「ご挨拶に伺う」＝去拜访问候，「に」表示目的。「〜たいと思っています」比「〜たいです」更客气、更像是深思熟虑后的打算。整句结构：理由（ので）→时间（前に）→动作。",
d:"帰国する前に、一度お会いしたいと思っています。=回国之前，想和您见一面。;寝る前に、必ず日記を書くようにしています。=睡前一定会写日记。;近いうちにご挨拶に伺います。=近期去拜访您。"},
{j:"彼とは知り合ってまだ一年しか経っていないのに、昔からの友達みたいに何でも話せるんです。",z:"和他认识才一年，却像老朋友一样什么都能聊。",
p:"彼(かれ)|他;*とは|と＋は：说到和他;知り合って(しりあって)|认识;まだ|才、还;一年(いちねん)|一年;しか|只（接否定）;経っていない(たっていない)|（时间）没过;*のに|却;昔(むかし)|从前;*から|从;*の|的;友達(ともだち)|朋友;みたいに|像…一样;何でも(なんでも)|什么都;話せる(はなせる)|能说;んです|解释",
t:"〜しか〜ない／〜のに／〜みたいに",
e:"「しか＋否定」强调“才、只有”，比「だけ」多了“少”的感觉。「のに」连接意外的结果：才认识一年→却什么都能聊。「みたいに」＝像…一样（口语），书面用「ように」。「彼とは」的「は」把“和他”提出来作为话题。",
d:"日本に来てまだ半年しか経っていないのに、日本語がすごく上手ですね。=来日本才半年，日语就这么好。;まるで夢みたいに楽しい一日でした。=像梦一样开心的一天。;三時間しか寝ていないのに、全然眠くない。=只睡了三小时，却一点都不困。"},
{j:"気を遣わなくていいよ。困った時はお互いさまなんだから。",z:"不用客气啦，有困难的时候本来就该互相帮忙嘛。",
p:"気(き)|心思;*を|宾语;遣わなくて(つかわなくて)|遣う的否定て形;いい|可以;*よ|啦;困った(こまった)|遇到困难的;時(とき)|时候;*は|话题;お互いさま(おたがいさま)|彼此彼此、互相的;なんだから|なのだから：毕竟是…嘛",
t:"〜なくていい／〜んだから",
e:"「〜なくていい」＝不用做…。「気を遣う」＝客气、顾虑别人。后一句用「んだから」给出理由，语气是“毕竟…嘛”，常用于安慰或说服。日语口语经常先说结论，再用「〜んだから」补充理由。",
d:"無理しなくていいよ。疲れてるんだから。=别勉强，你都累了。;そんなに謝らなくていいですよ。=不用那么道歉。;せっかく来たんだから、ゆっくりしていって。=难得来一趟，多待会儿吧。"},
{j:"言いにくいんですが、この前貸したお金、そろそろ返してもらえると助かるんですけど。",z:"有点难以启齿……之前借你的钱，差不多能还我的话就帮大忙了。",
p:"言い(いい)|言う的ます形;にくい|难以…;んですが|铺垫;この前(このまえ)|之前;貸した(かした)|借出的;お金(おかね)|钱（口语省略了を）;そろそろ|差不多该;返して(かえして)|还;もらえる|能得到（你还）;*と|如果…就;助かる(たすかる)|帮大忙;んですけど|委婉收尾",
t:"ます形＋にくい／〜てもらえると助かる",
e:"说难开口的事的标准结构：①「言いにくいんですが」先打招呼 ②说事情 ③用「〜てもらえると助かる」委婉提出请求。「助かる」把“你必须还”变成“你还的话我会很感激”，不会伤关系。「ます形＋にくい」＝难以…，「〜やすい」＝容易…。",
d:"言いにくいことなんですが、来月で辞めることになりました。=有件难开口的事，我下个月就要辞职了。;もう少し静かにしてもらえると助かるんですが。=能稍微安静一点的话就太好了。;この字は小さくて読みにくいです。=这个字太小，很难读。"},

// ── 2 自我介绍与经历
{j:"大学で日本語を専攻していたんですが、実際に日本に来てみたら、教科書の日本語とは全然違って驚きました。",z:"我大学专业是日语，可实际来日本一看，和教科书上的日语完全不一样，吓了一跳。",
p:"大学(だいがく)|大学;*で|在;日本語(にほんご)|日语;*を|宾语;専攻していた(せんこうしていた)|曾经主修;んですが|铺垫后转折;実際に(じっさいに)|实际;日本(にほん)|日本;*に|到达点;来て(きて)|来;みたら|てみたら：试着…结果发现;教科書(きょうかしょ)|教科书;*の|的;日本語(にほんご)|日语;*とは|と＋は：和…相比;全然(ぜんぜん)|完全;違って(ちがって)|不同（て形表原因）;驚きました(おどろきました)|吃惊了",
t:"〜てみたら／〜とは全然違う",
e:"讲经历的典型三段式：背景（んですが）→发现（てみたら）→感受（て驚きました）。「〜てみたら」表示“试着做了之后才发现”，后面接意外的发现。「〜と違う」助词用「と」，加「は」表示对比。「違って」的て形表示吃惊的原因。",
d:"食べてみたら、思ったよりおいしかったです。=吃了一下，比想象的好吃。;実際にやってみたら、意外と難しかった。=实际做了一下，意外地难。;写真で見たイメージとは全然違いました。=和在照片上看到的印象完全不同。"},
{j:"日本に来たばかりの頃は、言いたいことがうまく言えなくて、毎日悔しい思いをしていました。",z:"刚来日本的时候，想说的话说不好，每天都很不甘心。",
p:"日本(にほん)|日本;*に|到;来た(きた)|来了;ばかり|刚刚;*の|的;頃(ころ)|时候;*は|话题;言いたい(いいたい)|想说的;こと|事、话;*が|可能形的对象;うまく|好好地;言えなくて(いえなくて)|说不出（て形表原因）;毎日(まいにち)|每天;悔しい(くやしい)|不甘心;思い(おもい)|感受;*を|宾语;していました|思いをする＝有…的感受",
t:"た形＋ばかり／〜思いをする",
e:"「た形＋ばかり」＝刚刚…（心理上觉得很近，即使过了几个月也能用）。「〜ばかりの頃は」＝刚…的时候。可能形「言える」的对象常用「が」。「悔しい思いをする」＝经历不甘心的感受，比「悔しかった」更有画面感。",
d:"入社したばかりの頃は、毎日緊張していました。=刚进公司时每天都很紧张。;引っ越してきたばかりなので、まだこの辺のことがよく分かりません。=刚搬来，还不太熟悉这一带。;一人で寂しい思いをさせてしまって、ごめんね。=让你一个人受寂寞了，对不起。"},
{j:"今はIT企業でエンジニアとして働きながら、週末は日本語学校に通っています。",z:"现在一边在IT公司当工程师，一边周末去日语学校上课。",
p:"今(いま)|现在;*は|话题;IT企業(アイティーきぎょう)|IT企业;*で|动作场所;エンジニア|工程师;*として|作为（身份）;働き(はたらき)|働く的ます形;ながら|一边…一边;週末(しゅうまつ)|周末;*は|对比;日本語学校(にほんごがっこう)|日语学校;*に|去往;通っています(かよっています)|定期去、上学",
t:"〜として／ます形＋ながら",
e:"「として」表示身份、立场：作为工程师。「ます形＋ながら」＝一边…一边…，这里表示同一时期在做两件事。「は」在这里是对比：平时工作，周末上学。「通う」＝定期往返某地，学校、医院、公司都能用，助词是「に」。",
d:"留学生として、この大学で経済を勉強しています。=作为留学生在这所大学学经济。;音楽を聞きながら、仕事をするのが好きです。=喜欢一边听音乐一边工作。;子育てをしながら、資格の勉強を続けています。=一边带孩子一边坚持考证学习。"},
{j:"日本のアニメがきっかけで日本語を勉強し始めたんですが、今では仕事でも使うようになりました。",z:"我是因为日本动画才开始学日语的，现在连工作中也会用到了。",
p:"日本(にほん)|日本;*の|的;アニメ|动画;*が|主语;きっかけ|契机;*で|因为;日本語(にほんご)|日语;*を|宾语;勉強し(べんきょうし)|勉強する的ます形;始めた(はじめた)|开始;んですが|铺垫;今(いま)|现在;*では|如今已经;仕事(しごと)|工作;*でも|在…也;使う(つかう)|使用;ように|变得;なりました|了",
t:"〜がきっかけで／ます形＋始める／〜ようになる",
e:"讲“契机→开始→变化”的万能句。「Aがきっかけで」＝因为A这个契机（也可以说「Aをきっかけに」）。「ます形＋始める」＝开始做。「辞书形＋ようになる」＝从不…变成…（能力或习惯的变化）。「今では」强调“和以前比，如今已经…”。",
d:"留学をきっかけに、料理を始めました。=以留学为契机开始做饭了。;友達の一言がきっかけで、転職を決めました。=朋友的一句话让我决定换工作。;最近、やっと納豆が食べられるようになりました。=最近终于能吃纳豆了。"},
{j:"日本語能力試験のN2に合格するために、毎朝一時間早く起きて勉強することにしています。",z:"为了考过N2，我给自己定了规矩：每天早起一小时学习。",
p:"日本語能力試験(にほんごのうりょくしけん)|日语能力考试;*の|的;N2(エヌツー)|N2;*に|合格的对象;合格する(ごうかくする)|合格;ために|为了;毎朝(まいあさ)|每天早上;一時間(いちじかん)|一小时;早く(はやく)|早;起きて(おきて)|起床;勉強する(べんきょうする)|学习;こと|事;*に|决定的内容;しています|一直坚持",
t:"辞书形＋ために／〜ことにしている",
e:"「ために」表示目的，前面用意志动词辞书形。「〜ことにしている」＝自己定下并一直坚持的规矩（比「ことにした」多了“长期坚持”）。「試験に合格する」助词用「に」。语序：目的（ために）→时间（毎朝）→动作。",
d:"健康のために、エレベーターを使わないことにしています。=为了健康，我坚持不坐电梯。;家を買うために、毎月貯金しています。=为了买房每月存钱。;夜十時以降は何も食べないことにしています。=我规定自己晚上十点后不吃东西。"},
{j:"正直に言うと、話すのはまだ自信がないので、間違えても気にせずにどんどん話すようにしています。",z:"老实说，我对口语还没自信，所以尽量不怕说错、大胆多说。",
p:"正直に(しょうじきに)|老实地;言う(いう)|说;*と|一…就（正直に言うと＝说实话）;話す(はなす)|说;*の|把动词变名词;*は|对比;まだ|还;自信(じしん)|自信;*が|对象;ない|没有;*ので|因为;間違えても(まちがえても)|即使说错;気(き)|心思;*に|对象;せずに|しないで的书面形：不…而;どんどん|接连不断地;話す(はなす)|说;ように|尽量;しています|在做（习惯）",
t:"正直に言うと／〜ても／〜ずに／〜ようにしている",
e:"四个语法一句话：「正直に言うと」开场；「〜ても」＝即使；「〜ずに」＝不…而…（＝ないで，更书面）；「〜ようにしている」＝努力保持某习惯。注意「する」的ず形是「せず」，不是「しず」。这句话就是你练口语的态度！",
d:"辞書を使わずに、この本を読んでみてください。=试着不用词典读这本书。;朝ご飯を食べずに、家を出てしまった。=没吃早饭就出门了。;正直に言うと、あの映画はあまり面白くなかったです。=说实话，那部电影不太有意思。"},
{j:"実家は田舎にあるので、帰省するたびに、両親に早く結婚しろと言われるんです。",z:"我老家在乡下，每次回去爸妈都催我赶紧结婚。",
p:"実家(じっか)|老家;*は|话题;田舎(いなか)|乡下;*に|存在的场所;ある|在;*ので|因为;帰省する(きせいする)|回老家;たびに|每当…;両親(りょうしん)|父母;*に|被动句的施动者;早く(はやく)|快点;結婚しろ(けっこんしろ)|结婚（命令形）;*と|引用;言われる(いわれる)|被说;んです|解释",
t:"〜たびに／〜に〜と言われる（被动）",
e:"「辞书形＋たびに」＝每次…都…。被动句「AにBと言われる」＝被A说B，日语里很常用，表示说的人是对方、我是承受者，常带一点“烦”的感觉。「結婚しろ」是命令形，直接引用父母的原话。",
d:"この曲を聞くたびに、学生時代を思い出します。=每次听这首歌都会想起学生时代。;母に早く寝なさいと言われました。=被妈妈说早点睡。;会うたびに、彼女はきれいになっている気がする。=每次见她，都觉得她变漂亮了。"},
{j:"来日してもう五年になりますが、いまだに敬語の使い分けには自信がありません。",z:"来日本已经五年了，可至今对敬语的区分使用还是没有自信。",
p:"来日して(らいにちして)|来日本;もう|已经;五年(ごねん)|五年;*に|变化结果;なります|到了;*が|但是;いまだに|至今仍;敬語(けいご)|敬语;*の|的;使い分け(つかいわけ)|区分使用;*には|に＋は：在…方面;自信(じしん)|自信;*が|对象;ありません|没有",
t:"〜て〜になりますが／いまだに〜ない",
e:"「〜て＋时间＋になる」＝做了…已经多久。「いまだに」＝到现在还（多接否定或不理想的状态），比「まだ」语气更强，带着“都这么久了还…”的感觉。「〜には自信がない」：「には」限定范围“在…方面”。",
d:"東京に住んで十年になりますが、いまだに電車の乗り換えで迷います。=在东京住了十年，换乘时至今还会迷路。;何度も説明を聞いたのに、いまだによく分かりません。=听了好几次说明，至今还是不太懂。;この会社に入って三年になりますが、毎日が勉強です。=进公司三年了，每天都在学习。"},
{j:"もし日本に来ていなかったら、こんなにいろいろな経験はできなかったでしょうね。",z:"如果没来日本，大概就不会有这么多丰富的经历了吧。",
p:"もし|如果;日本(にほん)|日本;*に|到;来ていなかったら(きていなかったら)|如果没来（与事实相反）;こんなに|这么;いろいろな|各种各样的;経験(けいけん)|经历;*は|对比、强调;できなかった|不能（过去）;でしょう|吧;*ね|呢",
t:"〜ていなかったら、〜なかったでしょう",
e:"与事实相反的假设：「〜ていなかったら」（如果当时没…）＋「〜なかったでしょう」（就不会…了吧）。用「ていなかったら」比「なかったら」更强调“那个状态不存在”。「経験は」的「は」替代了「が」，强调“至少这些经历是不会有的”。",
d:"もしあの電車に乗っていたら、事故に遭っていたかもしれません。=要是坐了那班车，说不定就遇上事故了。;もっと早く知っていたら、申し込んでいたのに。=要是早点知道，我就报名了。;あの時やめていなかったら、今頃プロになっていたかも。=要是那时没放弃，现在可能已经是职业选手了。"},
{j:"これからは日本と中国の架け橋になれるような仕事をしていきたいと考えています。",z:"今后我想做能成为日中两国桥梁的工作。",
p:"これから|今后;*は|对比;日本(にほん)|日本;*と|和;中国(ちゅうごく)|中国;*の|的;架け橋(かけはし)|桥梁;*に|变成;なれる|能成为;ような|那样的;仕事(しごと)|工作;*を|宾语;して|做;いきたい|ていく＋たい：今后一直…下去;*と|引用;考えています(かんがえています)|在考虑",
t:"〜ような＋名词／〜ていきたい",
e:"「〜ような＋名词」＝像…那样的（举例或描述性质）：能成为桥梁那样的工作。「〜ていく」表示从现在往将来持续，「〜ていきたい」＝想今后一直…下去，面试和自我介绍里非常常用。「と考えています」比「と思っています」更正式、更深思熟虑。",
d:"将来は人の役に立てるような仕事がしたいです。=将来想做能帮助别人的工作。;これからも日本語の勉強を続けていきたいです。=今后也想继续学日语。;誰でも気軽に来られるようなお店を作りたい。=想开一家谁都能轻松来的店。"},

// ── 3 请求与拜托
{j:"お忙しいところ申し訳ないんですが、この書類に目を通していただけないでしょうか。",z:"百忙之中很抱歉，能请您过目一下这份文件吗？",
p:"お忙しい(おいそがしい)|您很忙;ところ|之时;申し訳ない(もうしわけない)|抱歉;んですが|铺垫;この|这;書類(しょるい)|文件;*に|对象;目(め)|眼睛;*を|宾语;通して(とおして)|目を通す＝过目;いただけない|能否请您;でしょうか|呢（最礼貌）",
t:"〜ところ申し訳ないんですが／〜ていただけないでしょうか",
e:"职场最礼貌的请求句型。结构：缓冲（お忙しいところ申し訳ないんですが）→请求（〜ていただけないでしょうか）。礼貌程度：てください＜てもらえますか＜ていただけますか＜ていただけないでしょうか。「目を通す」＝过目、浏览，「書類に目を通す」助词用「に」。",
d:"お手数をおかけしますが、もう一度確認していただけないでしょうか。=给您添麻烦了，能请您再确认一次吗？;ご迷惑でなければ、少し相談に乗っていただけないでしょうか。=如果不麻烦的话，能听我商量一下吗？;来週までにお返事をいただけると助かります。=下周之前能给我回复的话就太好了。"},
{j:"来週の月曜日なんですが、どうしても外せない用事があるので、休ませてもらえませんか。",z:"下周一我有件怎么也推不掉的事，能让我请个假吗？",
p:"来週(らいしゅう)|下周;*の|的;月曜日(げつようび)|周一;なんですが|是这样的（引出话题）;どうしても|无论如何;外せない(はずせない)|推不掉的;用事(ようじ)|事情;*が|主语;ある|有;*ので|因为;休ませて(やすませて)|休む的使役て形：让我休息;もらえませんか|能…吗",
t:"〜なんですが（引出话题）／使役て形＋もらえませんか",
e:"请假的标准说法。①「来週の月曜日なんですが」先点出话题 ②理由（どうしても外せない用事がある）③请求「休ませてもらえませんか」＝能让我休息吗。「使役＋てもらう」表示“请对方允许我做”，是请求许可的高级说法。",
d:"どうしても今日中に終わらせたいので、残業させてもらえませんか。=无论如何想今天做完，能让我加个班吗？;ちょっとこの部屋を使わせてもらえませんか。=能让我用一下这个房间吗？;どうしても納得できないので、もう一度説明してください。=怎么也想不通，请再说明一次。"},
{j:"無理を言って申し訳ないんですが、締め切りをあと数日延ばしてもらうわけにはいかないでしょうか。",z:"很抱歉提无理要求，截止日期能不能再延后几天？",
p:"無理(むり)|无理、勉强;*を|宾语;言って(いって)|说（て形表原因）;申し訳ない(もうしわけない)|抱歉;んですが|铺垫;締め切り(しめきり)|截止日期;*を|宾语;あと|再;数日(すうじつ)|几天;延ばして(のばして)|延长;もらう|得到;わけにはいかない|不能…（出于情理）;でしょうか|吗（委婉）",
t:"〜わけにはいかないでしょうか（极委婉的请求）",
e:"「わけにはいかない」本来是“出于情理不能…”，把它变成疑问「〜てもらうわけにはいかないでしょうか」，意思就成了“能不能请您…呢”，是商务里非常委婉的请求，适合提出比较为难对方的要求。前面「無理を言って申し訳ない」先承认自己在提无理要求。",
d:"今日は車なので、お酒を飲むわけにはいきません。=今天开车，不能喝酒。;お金を払ってもらうわけにはいかないので、ここは私が出します。=不能让你付钱，这里我来。;明日が試験だから、遊んでいるわけにはいかない。=明天就考试了，不能玩。"},
{j:"私の代わりに、この荷物を受け取っておいてもらえると助かるんだけど。",z:"要是你能替我先把这个包裹收下，就帮我大忙了。",
p:"私(わたし)|我;*の|的;代わりに(かわりに)|代替;この|这;荷物(にもつ)|包裹;*を|宾语;受け取って(うけとって)|接收;おいて|ておく：事先做好;もらえる|能得到;*と|的话;助かる(たすかる)|帮大忙;んだけど|口语委婉收尾",
t:"〜の代わりに／〜ておく／〜てもらえると助かる",
e:"三个语法叠加：「Aの代わりに」＝代替A；「〜ておく」＝事先做好、预先处理；「〜てもらえると助かる」＝你能…的话我会很感激（委婉请求）。和朋友说用「んだけど」，对上司改成「んですが」。",
d:"部長の代わりに、私が会議に出ることになりました。=由我代替部长参加会议。;お客さんが来る前に、部屋を片付けておいてね。=客人来之前把房间收拾好哦。;ついでにゴミを出しておいてもらえる？=能顺便帮我把垃圾扔了吗？"},
{j:"駅まで行くついでに、この手紙をポストに出してきてくれない？",z:"你去车站时，能顺便帮我把这封信投进邮筒吗？",
p:"駅(えき)|车站;*まで|到;行く(いく)|去;ついでに|顺便;この|这;手紙(てがみ)|信;*を|宾语;ポスト|邮筒;*に|到达点;出して(だして)|投递;きて|てくる：去做了再回来;くれない|能为我…吗（口语请求）",
t:"〜ついでに／〜てくる／〜てくれない？",
e:"「辞书形／名词の＋ついでに」＝做A的时候顺便做B。「〜てくる」＝去做某事再回来，「出してきて」＝去投了再回来。「〜てくれない？」是朋友间的请求，升调。「ポストに出す」＝投进邮筒，助词用「に」。",
d:"散歩のついでに、パンを買ってきました。=散步顺便买了面包回来。;コンビニに行くなら、ついでに牛乳を買ってきてくれない？=去便利店的话，顺便帮我买牛奶好吗？;出張のついでに、昔の友達に会ってきました。=出差时顺便见了老朋友。"},
{j:"もし差し支えなければ、どうしてこの仕事を選んだのか、聞かせていただけますか。",z:"如果不介意的话，能告诉我您为什么选择这份工作吗？",
p:"もし|如果;差し支え(さしつかえ)|妨碍、不便;なければ|没有的话;どうして|为什么;この|这;仕事(しごと)|工作;*を|宾语;選んだ(えらんだ)|选择了;*のか|疑问句做成分：…呢;聞かせて(きかせて)|聞く的使役て形：让我听;いただけますか|能请您…吗",
t:"差し支えなければ／疑问句＋か（间接疑问）／聞かせていただけますか",
e:"把疑问句「どうしてこの仕事を選んだ」加「のか」放进大句子里，当作宾语，这叫间接疑问。「聞かせていただけますか」＝能让我听听吗，比「教えてください」更客气。问别人隐私类问题时，先说「差し支えなければ」。",
d:"何時に着くか、教えてもらえますか。=能告诉我几点到吗？;どうすればいいのか、全然分かりません。=完全不知道该怎么办。;差し支えなければ、ご連絡先を伺ってもよろしいですか。=如果方便的话，可以请教您的联系方式吗？"},
{j:"私一人では決められないので、上司と相談した上で、改めてご連絡いたします。",z:"我一个人决定不了，和上司商量之后再另行联系您。",
p:"私(わたし)|我;一人(ひとり)|一个人;*では|靠…的话;決められない(きめられない)|决定不了;*ので|因为;上司(じょうし)|上司;*と|和;相談した(そうだんした)|商量了;上で(うえで)|之后（在…基础上）;改めて(あらためて)|重新、另行;ご連絡いたします(ごれんらくいたします)|联系您（谦让语）",
t:"た形＋上で／改めて",
e:"「た形＋上で」＝做完A之后，基于A再做B，强调“先A”这一步很重要，商务常用。「改めて」＝另找时间、重新。这句是不当场答应、又不得罪人的标准说法。",
d:"内容をよく確認した上で、サインしてください。=请确认好内容再签名。;家族と話し合った上で、決めたいと思います。=想和家人商量后再决定。;また改めてお電話いたします。=我再另行致电。"},
{j:"何度もお願いして悪いんだけど、もう一回だけ手を貸してくれないかな。",z:"一再拜托你真不好意思，能再帮我一次吗？",
p:"何度も(なんども)|好几次;お願いして(おねがいして)|拜托（て形表原因）;悪い(わるい)|过意不去;んだけど|铺垫;もう一回(もういっかい)|再一次;だけ|只;手(て)|手;*を|宾语;貸して(かして)|手を貸す＝帮忙;くれない|能为我…吗;かな|…吧（自言自语式询问）",
t:"〜て悪いんだけど／〜てくれないかな",
e:"「〜て悪い」＝因为…而过意不去，て形表示原因。「〜てくれないかな」带着自言自语的语气，比「てくれない？」更软，让对方好拒绝。「手を貸す」＝帮一把。",
d:"急に呼び出して悪いんだけど、ちょっと来てくれない？=突然叫你出来不好意思，能来一下吗？;待たせて悪かったね。=让你久等了。;誰か手伝ってくれないかな。=有没有人能帮帮我呢。"},
{j:"この件については、私からではなく、担当者から直接説明してもらったほうがいいと思います。",z:"关于这件事，我觉得最好不是由我，而是请负责人直接来说明。",
p:"この|这;件(けん)|事;*については|关于…（は表强调）;私(わたし)|我;*から|从;ではなく|不是…而是;担当者(たんとうしゃ)|负责人;*から|从;直接(ちょくせつ)|直接;説明して(せつめいして)|说明;もらった|得到;ほうがいい|最好;*と|引用;思います(おもいます)|觉得",
t:"AではなくB／〜てもらったほうがいい",
e:"「AではなくB」＝不是A而是B。「〜から説明してもらう」中的「から」表示信息的来源（由谁来说明）。「た形＋ほうがいい」＝建议。整句是职场中把问题转给合适的人的礼貌说法。",
d:"電話ではなく、メールで連絡してもらえますか。=能不用电话、而用邮件联系吗？;一人で悩むより、専門家に相談したほうがいいですよ。=与其一个人烦恼，不如找专家商量。;今日ではなく、明日にしませんか。=不是今天，改明天好吗？"},
{j:"使い方がよく分からないので、お手数ですが、一度実際にやって見せていただけませんか。",z:"我不太清楚用法，麻烦您能实际示范一次给我看吗？",
p:"使い方(つかいかた)|用法;*が|对象;よく|好好;分からない(わからない)|不懂;*ので|因为;お手数(おてすう)|麻烦;ですが|是…但;一度(いちど)|一次;実際に(じっさいに)|实际;やって|做;見せて(みせて)|给人看;いただけませんか|能请您…吗",
t:"〜て見せる／お手数ですが",
e:"「〜て見せる」＝做给别人看、示范。「お手数ですが」＝给您添麻烦了（请求前的缓冲）。语序：理由（ので）→缓冲（お手数ですが）→请求。",
d:"先生がお手本を書いて見せてくれました。=老师写了个示范给我们看。;お手数ですが、こちらにご記入ください。=麻烦您填写这里。;一回やって見せるから、よく見ててね。=我做一遍给你看，仔细看着哦。"},

// ── 4 购物与售后
{j:"ネットで見て気になっていたんですが、実物を見ると思っていたより色が明るいですね。",z:"在网上看到后一直很在意，看到实物觉得颜色比想象的亮呢。",
p:"ネット|网上;*で|在;見て(みて)|看到;気になっていた(きになっていた)|一直在意;んですが|铺垫;実物(じつぶつ)|实物;*を|宾语;見る(みる)|看;*と|一…就;思っていた(おもっていた)|原以为的;*より|比;色(いろ)|颜色;*が|主语;明るい(あかるい)|亮;ですね|呢",
t:"〜が気になる／〜と／思っていたより",
e:"「気になる」＝在意、惦记，「気になっていた」＝一直惦记着。「辞书形＋と」＝一…就（发现），后面接看到的结果。「思っていたより」＝比原来想的，比「思ったより」更强调“一直以为”。",
d:"ずっと気になっていたお店に、やっと行けました。=终于去了一直想去的店。;実際に使ってみると、思っていたより重かったです。=实际用起来，比想象的重。;駅を出ると、すぐ目の前に海が見えます。=一出车站，眼前就能看到大海。"},
{j:"これ、色違いで迷ってるんですけど、どっちのほうが私に似合うと思いますか。",z:"这个有不同颜色，我在纠结，你觉得哪个更适合我？",
p:"これ|这个;色違い(いろちがい)|不同颜色款;*で|因为、在…上;迷ってる(まよってる)|在犹豫（ている的口语）;んですけど|铺垫;どっち|哪个;*の|的;ほう|一方;*が|主语;私(わたし)|我;*に|对…;似合う(にあう)|合适;*と|引用;思いますか(おもいますか)|你觉得吗",
t:"〜で迷う／どっちのほうが〜と思いますか",
e:"「Aで迷う」＝在A上犹豫。「どっちのほうが」用于二选一的比较。「Aに似合う」＝适合A，助词用「に」。最后「と思いますか」征求对方意见，比直接问「どっちがいい？」更礼貌。",
d:"進学か就職かで、ずっと迷っています。=升学还是就业，一直在犹豫。;赤と青、どっちのほうがいいと思う？=红和蓝，你觉得哪个好？;その髪型、すごく似合ってますね。=那个发型很适合你呢。"},
{j:"セールだからといって、要らないものまで買ってしまうと、結局損することになりますよ。",z:"虽说在打折，可连不需要的东西都买的话，最后反而会吃亏哦。",
p:"セール|打折;だからといって|虽说…但（不能因此就）;要らない(いらない)|不需要的;もの|东西;*まで|连…都;買って(かって)|买;しまう|てしまう;*と|的话;結局(けっきょく)|最终;損する(そんする)|吃亏;こと|事;*に|变成;なります|会;*よ|哦",
t:"〜からといって／〜まで／〜ことになる",
e:"「〜からといって」＝虽说…，但不能因此就…（后面常接否定或负面结果）。「まで」＝连…都（超出预期的范围）。「〜ことになる」＝结果会变成…。一句话完成“前提→行为→结果”的劝告。",
d:"安いからといって、すぐに買うのはよくない。=不能因为便宜就马上买。;日本人だからといって、敬語が完璧なわけではない。=就算是日本人，敬语也不一定完美。;子どもにまで笑われてしまった。=连小孩都笑我。"},
{j:"二つ買うと一つ当たりの値段が安くなるなら、友達の分もまとめて買っておこうかな。",z:"如果买两个单价会更便宜，那就把朋友的份也一起买了吧。",
p:"二つ(ふたつ)|两个;買う(かう)|买;*と|的话;一つ当たり(ひとつあたり)|每一个;*の|的;値段(ねだん)|价格;*が|主语;安く(やすく)|便宜;なる|变得;なら|如果是那样的话;友達(ともだち)|朋友;*の|的;分(ぶん)|份;*も|也;まとめて|一起、汇总;買って(かって)|买;おこう|ておく的意志形;かな|…吧（自言自语）",
t:"〜なら／〜ておこうかな",
e:"「なら」接在听到的信息后面：“如果是那样的话，那么…”，很适合根据对方说的话做决定。「〜ておこう」＝预先做好吧，加「かな」变成自言自语的打算。「まとめて」＝一起、打包。",
d:"北海道に行くなら、冬がおすすめですよ。=要去北海道的话，推荐冬天。;雨が降りそうだから、傘を持っていこうかな。=好像要下雨，带把伞吧。;週末に安くなるなら、それまで待とうかな。=周末会便宜的话，就等到那时吧。"},
{j:"このパソコン、買ってからまだ一か月も経っていないのに、もう電源が入らなくなってしまったんです。",z:"这台电脑买了还不到一个月，就已经开不了机了。",
p:"この|这;パソコン|电脑;買って(かって)|买;*から|以来;まだ|还;一か月(いっかげつ)|一个月;*も|（强调）竟;経っていない(たっていない)|没过;*のに|却;もう|已经;電源(でんげん)|电源;*が|主语;入らなく(はいらなく)|开不了;なって|变得;しまった|遗憾;んです|解释",
t:"〜てから〜も経っていないのに",
e:"投诉的典型句。「〜てから」＝自…以来；「一か月も」的「も」强调时间短（才一个月）；「のに」表示不满；「〜なくなってしまった」＝变得不能…了（遗憾）。「電源が入る」＝开机。",
d:"始めてから十分も経っていないのに、もう疲れた。=开始还不到十分钟就累了。;入社してから一週間しか経っていません。=进公司才一周。;昨日買ったばかりなのに、もう壊れてしまった。=昨天刚买，就已经坏了。"},
{j:"保証期間内であれば、無料で修理してもらえるはずなんですが、確認していただけますか。",z:"在保修期内的话，应该能免费修理，能帮我确认一下吗？",
p:"保証期間(ほしょうきかん)|保修期;内(ない)|内;であれば|如果是（较正式）;無料(むりょう)|免费;*で|以…方式;修理して(しゅうりして)|修理;もらえる|能得到;はず|应该;なんですが|铺垫;確認して(かくにんして)|确认;いただけますか|能请您…吗",
t:"〜であれば／〜はずなんですが",
e:"「はず」＝按道理应该，用于有根据的判断。「〜はずなんですが」后面接请求，委婉地表达“按理说应该是这样”。「であれば」是「なら」的正式说法。",
d:"予約したはずなんですが、名前がないと言われました。=我应该预约了，却被告知没有我的名字。;必要であれば、いつでも連絡してください。=需要的话请随时联系。;もう届いているはずなのに、まだ来ていません。=应该已经送到了，却还没来。"},
{j:"レシートがなくても、購入した日付が分かれば返品できるかどうか、聞いてみてもいいですか。",z:"想问一下：没有小票，但知道购买日期的话，能不能退货？",
p:"レシート|小票;*が|主语;なくても|即使没有;購入した(こうにゅうした)|购买的;日付(ひづけ)|日期;*が|主语;分かれば(わかれば)|如果知道;返品できる(へんぴんできる)|能退货;かどうか|是否;聞いて(きいて)|问;みても|试着…也;いいですか|可以吗",
t:"〜ても／〜ば／〜かどうか",
e:"把“没有小票但知道日期，能不能退货”整个问题用「かどうか」包起来当宾语，再问“可以问一下吗”。条件叠加：「なくても」（即使没有）＋「分かれば」（如果知道）。",
d:"明日晴れるかどうか、まだ分かりません。=明天是否晴天还不知道。;この服、洗濯機で洗えるかどうか教えてください。=请告诉我这件衣服能不能机洗。;間に合うかどうか分からないけど、とりあえず行ってみる。=不知道赶不赶得上，总之先去看看。"},
{j:"店員さんに勧められるままに買ってしまったけど、よく考えたら別に必要なかったかも。",z:"店员推荐什么我就买了，仔细想想其实可能并不需要。",

{j:"送料を考えると、ネットで買うより近くの店で買ったほうが、かえって安く済むかもしれません。",z:"考虑到运费，在附近店里买可能反而比网购便宜。",

{j:"予約した商品を取りに来たんですが、まだ準備ができていないようなら、また出直します。",z:"我来取预约的商品，如果还没准备好，我就改天再来。",

// ── 5 餐厅与聚会
{j:"予約はしていないんですが、四人でも入れるようなら、カウンター席でも構いません。",z:"我们没有预约，如果四个人能进的话，坐吧台也没关系。",

t:"〜でも構いません／〜ようなら",
e:"「名词＋でも構わない」＝…也可以（降低要求）。「予約は」的「は」表示对比：“预约嘛是没有…”。两个「でも」作用相同：即使是四个人、即使是吧台。「四人」读「よにん」。",
d:"立ち席でも構わないので、入れますか。=站着也没关系，能进吗？;少し遅くなっても構いませんか。=稍微晚点也可以吗？;空いていないようなら、ほかの店にしましょう。=如果没位子，就去别的店吧。"},
{j:"量が多いと聞いたので、一人一品ずつ頼まずに、みんなでシェアしませんか。",z:"听说这里分量很大，我们别每人点一道，大家一起分着吃吧？",
p:"量(りょう)|分量;*が|主语;多い(おおい)|多;*と|引用;聞いた(きいた)|听说;*ので|因为;一人(ひとり)|一个人;一品(いっぴん)|一道菜;ずつ|各、每;頼まずに(たのまずに)|不点而;みんな|大家;*で|以…人数（全员）;シェアしませんか|一起分享吗",
t:"〜と聞いた／〜ずつ／〜ずに",
e:"「〜と聞いた」＝听说（信息来源）。「数量＋ずつ」＝每…各…。「〜ずに」＝不…而…。「みんなで」的「で」表示以什么人数、范围做事。提议用「〜ませんか」，很自然。",
d:"一人二枚ずつ取ってください。=请每人拿两张。;今日は休みだと聞いていたんですが。=我听说今天休息……;傘を持たずに出かけて、雨に降られた。=没带伞出门，被雨淋了。"},
{j:"ここの料理は、見た目が地味なわりに味は本格的で、何を食べてもハズレがないんですよ。",z:"这家的菜看着朴素，味道却很正宗，吃什么都不会踩雷。",
p:"ここ|这里;*の|的;料理(りょうり)|菜;*は|话题;見た目(みため)|外观;*が|主语;地味な(じみな)|朴素的;わりに|与…不相称地;味(あじ)|味道;*は|对比;本格的(ほんかくてき)|正宗;*で|て形并列;何(なに)|什么;*を|宾语;食べても(たべても)|无论吃;ハズレ|失败、踩雷;*が|主语;ない|没有;んですよ|哦（告诉对方）",
t:"〜わりに／疑问词＋ても",
e:"「〜わりに」＝与…相比（出乎意料），这里是“外表朴素，味道却很正宗”。「見た目が…、味は…」用は和が做对比。「疑问词＋ても」＝无论…都。「ハズレ」＝没中、踩雷，口语常用。",
d:"この店は値段のわりに量が多いです。=这家店价格不贵，量却很多。;彼は年齢のわりに若く見える。=他看起来比实际年龄年轻。;何度聞いても覚えられません。=听多少遍都记不住。"},
{j:"お酒はあまり強くないので、最初の一杯だけ付き合って、あとはウーロン茶にします。",z:"我酒量不太好，第一杯陪着喝，之后就换乌龙茶。",
p:"お酒(おさけ)|酒;*は|话题;あまり|不太;強くない(つよくない)|（酒量）不强;*ので|因为;最初(さいしょ)|最初;*の|的;一杯(いっぱい)|一杯;だけ|只;付き合って(つきあって)|奉陪;あと|之后;*は|对比;ウーロン茶(ウーロンちゃ)|乌龙茶;*に|选择的结果;します|决定",
t:"〜だけ／〜にします",
e:"日本聚餐里不喝酒又不扫兴的说法。「お酒に強い」＝酒量好。「付き合う」＝陪着做（不只是“交往”）。「あとは」的「は」对比“第一杯”和“之后”。「〜にします」表示选择。",
d:"少しだけなら、飲めます。=一点点的话能喝。;今日は最後まで付き合うよ。=今天陪你到最后。;私はデザートだけにしておきます。=我就只要甜点吧。"},
{j:"今日は私のために、皆さんにこんなに素敵な送別会を開いていただいて、本当に感激しています。",z:"今天大家为我办了这么棒的欢送会，我真的非常感动。",
p:"今日(きょう)|今天;*は|话题;私(わたし)|我;*の|的;ために|为了;皆さん(みなさん)|大家;*に|从…（得到）;こんなに|这么;素敵な(すてきな)|美好的;送別会(そうべつかい)|欢送会;*を|宾语;開いて(ひらいて)|举办;いただいて|承蒙（て形表原因）;本当に(ほんとうに)|真的;感激しています(かんげきしています)|很感动",
t:"名词＋のために／〜ていただいて",
e:"致辞用句。「Aのために」＝为了A。「Bに〜ていただく」＝承蒙B为我做…，「に」表示动作的施予者。「〜ていただいて＋感受」是日本致辞的固定结构。",
d:"私のために時間を作っていただいて、ありがとうございます。=谢谢您为我抽出时间。;子どものために、毎朝お弁当を作っています。=为了孩子，每天早上做便当。;遠くから来ていただいて、恐縮です。=让您远道而来，真过意不去。"},
{j:"支払いは別々でもいいですか。私、さっき飲み物しか頼んでいないので。",z:"可以分开结账吗？我刚才只点了饮料。",
p:"支払い(しはらい)|付款;*は|话题;別々(べつべつ)|分开;*でも|也;いいですか|可以吗;私(わたし)|我;さっき|刚才;飲み物(のみもの)|饮料;しか|只;頼んでいない(たのんでいない)|没点;*ので|因为（句末补充理由）",
t:"〜しか〜ない／句末〜ので（补充理由）",
e:"日语口语常常先提请求，再用「〜ので。」在句末补充理由，这样显得不那么强硬。「しか＋否定」＝只。「私、」口语省略了「は」。",
d:"今日はちょっと早めに帰ります。明日、朝が早いので。=今天我早点回去，明天要早起。;私、コーヒーしか飲めないんです。=我只能喝咖啡。;すみません、一万円札しか持っていないんですが。=不好意思，我只有一万日元的纸币。"},
{j:"気に入ってもらえるかどうか分からないけど、地元の名物を持ってきたので、よかったら食べてみて。",z:"不知道你会不会喜欢，我带了家乡特产，不嫌弃的话尝尝。",
p:"気に入って(きにいって)|喜欢;もらえる|能得到;かどうか|是否;分からない(わからない)|不知道;*けど|但;地元(じもと)|家乡;*の|的;名物(めいぶつ)|特产;*を|宾语;持って(もって)|拿;きた|てくる：带来;*ので|因为;よかったら|不嫌弃的话;食べて(たべて)|吃;みて|试试（口语请求）",

e:"送礼时的谦虚说法。「気に入る」＝中意；「〜てもらえるかどうか」＝不知道对方会不会…。「持ってきた」＝带来（て形＋くる表示带着过来）。结尾「食べてみて」是朋友间的请求，省略了「ください」。",
d:"口に合うかどうか分かりませんが、どうぞ召し上がってください。=不知道合不合您口味，请尝尝。;うまくできるかどうか分からないけど、やってみます。=不知道能不能做好，但我试试。;旅行のお土産を買ってきたよ。=给你买了旅行的特产回来哦。"},
{j:"飲み会の幹事を任されたものの、店選びから人数の調整まで、思った以上に大変でした。",z:"虽然被委托当酒会的组织者，可从选店到调整人数，比想象的辛苦多了。",
p:"飲み会(のみかい)|酒会;*の|的;幹事(かんじ)|干事、组织者;*を|宾语;任された(まかされた)|被委托;ものの|虽然…但;店選び(みせえらび)|选店;*から|从;人数(にんずう)|人数;*の|的;調整(ちょうせい)|调整;*まで|到;思った(おもった)|想的;以上に(いじょうに)|以上;大変(たいへん)|辛苦;でした|是（过去）",
t:"〜ものの／AからBまで／思った以上に",
e:"「〜ものの」＝虽然…但是（书面一点，比「けど」正式），后面接与预期不符的结果。「AからBまで」列举范围，表示“所有的事”。「思った以上に」＝比想的还要…。",
d:"参加すると言ったものの、まだ準備が全然できていない。=虽然说了要参加，但完全没准备。;免許は取ったものの、ほとんど運転していません。=驾照是考了，但几乎没开过车。;思った以上に人が集まりました。=来的人比想象的多。"},
{j:"終電の時間が近づいてきたので、名残惜しいですが、私はそろそろ失礼させていただきます。",z:"末班车时间快到了，虽然依依不舍，我差不多先告辞了。",
p:"終電(しゅうでん)|末班车;*の|的;時間(じかん)|时间;*が|主语;近づいて(ちかづいて)|接近;きた|てくる：逐渐;*ので|因为;名残惜しい(なごりおしい)|依依不舍;ですが|但;私(わたし)|我;*は|对比;そろそろ|差不多;失礼させて(しつれいさせて)|让我告辞;いただきます|谦让",
t:"〜てきた／〜させていただきます",
e:"聚会中途离开的完美说法：理由（終電）→不舍（名残惜しいですが）→告辞（失礼させていただきます）。「〜てくる」表示变化逐渐接近说话人。「させていただく」是很谦虚的说法。",
d:"だんだん寒くなってきましたね。=渐渐冷起来了。;本日はこれで終了させていただきます。=今天就到此结束。;名残惜しいですが、今日はここでお開きにしましょう。=虽然不舍，今天就到这儿散了吧。"},
{j:"次の店に行くかどうかは、みんなの様子を見てから決めればいいんじゃない？",z:"去不去下一家，看看大家的状态再定不就好了？",
p:"次(つぎ)|下一个;*の|的;店(みせ)|店;*に|到;行く(いく)|去;かどうか|是否;*は|话题;みんな|大家;*の|的;様子(ようす)|状态;*を|宾语;見て(みて)|看;*から|之后;決めれば(きめれば)|决定的话;いい|好;んじゃない|不是…吗（提议）",
t:"〜かどうかは／〜てから／〜ばいいんじゃない？",
e:"「〜かどうかは」把整个问题当作话题。「〜てから」＝先…再…。「〜ばいいんじゃない？」＝…不就好了吗，轻松地提建议。",
d:"行くかどうかは、天気を見てから決めます。=去不去，看天气再定。;分からなかったら、先生に聞けばいいんじゃない？=不懂的话问老师不就好了？;一度食べてから文句を言えばいいのに。=尝过再挑剔也不迟嘛。"},

d:"台風の影響で、飛行機が欠航になったらしいです。=好像因为台风航班取消了。;雪の影響で、道路がかなり混んでいます。=受雪影响，道路很堵。;この調子だと、今日中には終わりそうにありません。=照这样，今天之内完不成。"},
{j:"乗り換えの時間がほとんどないので、もし間に合わなかったら、先に行っていてください。",z:"换乘时间几乎没有，如果我没赶上，你们先走吧。",

{j:"東京駅で新幹線に乗り換えるつもりだったのに、うっかり寝過ごして終点まで行ってしまいました。",z:"本打算在东京站换乘新干线，结果不小心睡过站，一直坐到了终点。",

{j:"道に迷ったら困るので、念のため、駅からの行き方を地図で確認しておきます。",z:"迷路就麻烦了，为保险起见，我先在地图上确认一下从车站过去的路。",

e:"表达不满又不吵架的说法。「〜ないでもない」＝也不是不…（勉强认同）。「そういう言い方をされると」＝被用那种方式说的话（被动）。「さすがに」＝再怎么（宽容）也…。",
d:"気持ちは分からないでもないです。=你的心情也不是不能理解。;そこまで言われると、さすがに腹が立つ。=被说到那份上，再怎么也会生气。;行けないこともないけど、ちょっと遠いね。=也不是去不了，就是有点远。"},
{j:"確かにその案にはメリットもありますが、コストの面を考えると、現実的とは言えないのではないでしょうか。",z:"那个方案确实也有优点，但考虑到成本，恐怕不能说是现实的吧。",
p:"確かに(たしかに)|确实;その|那;案(あん)|方案;*には|に＋は;メリット|优点;*も|也;あります|有;*が|但;コスト|成本;*の|的;面(めん)|方面;*を|宾语;考える(かんがえる)|考虑;*と|的话;現実的(げんじつてき)|现实的;*とは|と＋は;言えない(いえない)|不能说;*の|の（ではないか）;ではないでしょうか|不是…吗（委婉反对）",
t:"確かに〜が／〜とは言えない／〜のではないでしょうか",
e:"委婉反对的三步：①「確かに〜が」先认同 ②「〜を考えると」给出角度 ③「〜とは言えないのではないでしょうか」委婉否定。日本人很少直接说“不对”，这个结构非常实用。",
d:"確かに安いですが、品質がいいとは言えません。=确实便宜，但质量不能说好。;もう少し様子を見たほうがいいのではないでしょうか。=是不是再观察一下比较好呢？;必ずしも正しいとは言えない。=未必是对的。"},
{j:"彼が約束を破るはずがないから、きっと何か事情があったに違いないと思う。",z:"他不可能失约，我想一定是有什么原因。",

t:"〜はずがない／〜に違いない",
e:"两个强烈判断：「〜はずがない」＝按道理不可能；「〜に違いない」＝一定是（主观确信）。前因后果用「から」连接。",
d:"こんな簡単な問題、間違えるはずがない。=这么简单的题不可能错。;電気がついているから、まだ誰かいるに違いない。=灯还亮着，一定还有人。;あの真面目な彼がうそをつくはずがありません。=那么认真的他不可能说谎。"},
{j:"頑張れば頑張るほど空回りしてしまって、自分でもどうしたらいいのか分からなくなってきました。",z:"越努力越白忙，连我自己都不知道该怎么办了。",
p:"頑張れば(がんばれば)|如果努力;頑張る(がんばる)|努力;ほど|越…越;空回りして(からまわりして)|空转、白忙;しまって|てしまう;自分(じぶん)|自己;*でも|也、连;どうしたら|怎么做;いい|好;*のか|间接疑问;分からなく(わからなく)|不知道;なって|变得;きました|てくる：渐渐",
t:"〜ば〜ほど／どうしたらいいのか",
e:"「Aば Aほど」＝越…越…（同一个词重复）。「空回り」＝空转，比喻白费力气。「どうしたらいいのか分からない」间接疑问。「〜なってきた」＝渐渐变得。",
d:"考えれば考えるほど、分からなくなる。=越想越不明白。;日本語は勉強すればするほど難しく感じます。=日语越学越觉得难。;練習すればするほど上手になります。=越练越好。"},
{j:"失敗したことより、挑戦しなかったことのほうが、後になってずっと後悔すると思うんです。",z:"我觉得比起失败，没去挑战的事才会在以后更让人后悔。",
p:"失敗した(しっぱいした)|失败了的;こと|事;*より|比;挑戦しなかった(ちょうせんしなかった)|没挑战的;こと|事;*の|的;ほう|一方;*が|主语;後(あと)|以后;*に|到了;なって|なる;ずっと|（比较）更加;後悔する(こうかいする)|后悔;*と|引用;思う(おもう)|觉得;んです|说明",
t:"AよりBのほうが／後になって",
e:"用比较句表达人生观。「〜こと」把整段动作变成名词来比较。「後になって」＝事后、后来。「ずっと」在比较句里＝更加，不是“一直”。",
d:"言葉より行動のほうが大切だと思います。=我觉得行动比语言更重要。;後になって、あの時の先生の言葉の意味が分かりました。=后来才明白当时老师那句话的意思。;何もしないより、やってみたほうがいい。=与其什么都不做，不如试试。"},
{j:"最初は日本の生活に慣れるかどうか不安でしたが、周りの人に助けられて、今ではすっかり馴染んでいます。",z:"起初担心能不能适应日本的生活，但在周围人的帮助下，现在已经完全融入了。",
p:"最初(さいしょ)|起初;*は|对比;日本(にほん)|日本;*の|的;生活(せいかつ)|生活;*に|对象;慣れる(なれる)|习惯;かどうか|是否;不安(ふあん)|不安;でした|是（过去）;*が|但;周り(まわり)|周围;*の|的;人(ひと)|人;*に|被动句的施动者;助けられて(たすけられて)|被帮助;今(いま)|现在;*では|如今;すっかり|完全;馴染んでいます(なじんでいます)|融入了",
t:"〜かどうか不安／被动て形（原因）",
e:"讲经历的“过去→转折→现在”结构。「最初は…が、今では…」形成对比。「〜に助けられて」用被动表达“得到帮助”，带着感激。「馴染む」＝融入、熟悉环境。",
d:"最初は不安でしたが、今では仕事が楽しいです。=起初很不安，现在工作很愉快。;多くの人に支えられて、ここまで来ることができました。=在很多人的支持下才走到今天。;新しい職場にもだいぶ慣れてきました。=新职场也相当适应了。"},
{j:"あんなに練習したのに本番で失敗するなんて、悔しくてたまりません。",z:"练了那么多，正式上场却失败了，真是不甘心得不得了。",
p:"あんなに|那么;練習した(れんしゅうした)|练习了;*のに|却;本番(ほんばん)|正式上场;*で|在;失敗する(しっぱいする)|失败;なんて|竟然…（意外、感叹）;悔しくて(くやしくて)|不甘心;たまりません|…得受不了",
t:"〜のに／〜なんて／〜てたまらない",
e:"表达强烈情绪：「〜なんて」＝竟然…（意外、不敢相信）。「形容词て形＋たまらない」＝…得受不了。前面用「のに」表示和付出不相称的结果。",
d:"合格できたなんて、うれしくてたまりません。=竟然合格了，高兴得不得了。;まさか彼が辞めるなんて、信じられない。=他竟然会辞职，真不敢相信。;一人暮らしは寂しくてたまらない時があります。=一个人住有时寂寞得受不了。"},
{j:"周りの意見に流されるのではなく、自分が本当にやりたいことは何なのか、一度じっくり考えてみるべきだよ。",z:"别随波逐流听别人的，你应该好好想想自己真正想做的到底是什么。",
p:"周り(まわり)|周围;*の|的;意見(いけん)|意见;*に|被;流される(ながされる)|被冲走、随波逐流;*の|名词化;ではなく|不是…而是;自分(じぶん)|自己;*が|主语;本当に(ほんとうに)|真的;やりたい|想做的;こと|事;*は|话题;何(なん)|什么;なのか|是…呢（间接疑问）;一度(いちど)|一次;じっくり|仔细地;考えて(かんがえて)|想;みる|试试;べき|应该;だ|是;*よ|哦",
t:"〜のではなく／〜べきだ",
e:"「〜のではなく」＝不要…而要…。「意見に流される」＝被意见左右（被动）。「〜は何なのか」把疑问放进句子里。「べきだよ」是朋友之间的强烈建议。",
d:"人のせいにするのではなく、自分で解決しよう。=不要怪别人，自己解决吧。;謝るべきなのは私のほうです。=该道歉的是我。;答えを教えるのではなく、考え方を教えたい。=不是想教答案，而是想教思路。"},
{j:"日本に住んでみて初めて、家族と離れて暮らすことがどれほど寂しいか分かりました。",z:"在日本住了之后我才第一次明白，和家人分开生活有多寂寞。",
p:"日本(にほん)|日本;*に|在;住んで(すんで)|住;みて|试着;初めて(はじめて)|才第一次;家族(かぞく)|家人;*と|和;離れて(はなれて)|分开;暮らす(くらす)|生活;こと|事;*が|主语;どれほど|多么;寂しい(さびしい)|寂寞;*か|间接疑问;分かりました(わかりました)|明白了",

e:"「〜て初めて」＝做了…之后才第一次（明白、意识到）。「どれほど〜か分かる」＝明白有多么…（间接感叹）。主语是一个长名词短语「家族と離れて暮らすこと」。",
d:"親になって初めて、親のありがたさが分かった。=自己当了父母，才明白父母的可贵。;病気になって初めて、健康の大切さに気づきました。=生病后才意识到健康的重要。;この仕事がどれほど大変か、やってみないと分からない。=这份工作有多辛苦，不做不知道。"},
{j:"好きなことを仕事にできるに越したことはないけど、現実はそう簡単にはいかないよね。",z:"能把喜欢的事当工作当然最好，但现实没那么简单啊。",

e:"「〜に越したことはない」＝…当然最好（N2）。「AをBにする」＝把A变成B。「そう簡単にはいかない」＝没那么容易，「いく」在这里是“进展”的意思。",
d:"安くて品質がいいに越したことはない。=又便宜质量又好当然最好。;準備は早いに越したことはありません。=准备越早越好。;人生、思い通りにはいかないものだね。=人生总不能事事如意啊。"},

{j:"週末は天気が崩れるおそれがあるので、雨が降った場合に備えて、屋内で楽しめるプランも考えておこう。",z:"周末天气可能会变差，为防下雨，我们也想好一个室内的方案吧。",

d:"このままだと、締め切りに間に合わないおそれがあります。=照这样下去，可能赶不上截止日期。;地震に備えて、水と食料を用意しています。=为防地震，准备了水和食物。;遅れる場合は、必ず連絡してください。=迟到的话请务必联系。"},
{j:"せっかく京都まで行くんだから、有名な観光地だけじゃなくて、地元の人しか知らないような店にも行ってみたいな。",z:"难得去京都，不光是有名的景点，还想去那种只有当地人才知道的店看看。",

d:"せっかく日本にいるんだから、温泉に行かなきゃ。=难得在日本，得去泡温泉。;彼は日本語だけじゃなくて、韓国語も話せる。=他不仅会日语，还会说韩语。;せっかくだから、記念に写真を撮りましょう。=难得来一趟，拍张照留念吧。"},
{j:"都合が合わない人もいると思うので、日程は全員の予定を聞いてから決めることにしましょう。",z:"可能有人时间不合，日程就等问完所有人的安排再定吧。",

d:"結果が出てから、また話し合うことにしましょう。=等结果出来再商量吧。;みんなの意見を聞いてから決めます。=听完大家的意见再决定。;今年から毎月貯金することにしました。=从今年起决定每月存钱。"},
{j:"当日になって慌てないように、持ち物リストを作って、前の晩までに全部そろえておくつもりです。",z:"为了当天不手忙脚乱，我打算列个物品清单，前一晚之前全部备齐。",

d:"忘れないように、カレンダーに書いておきます。=为了不忘，写在日历上。;月末までに、レポートを仕上げるつもりです。=打算月底前完成报告。;風邪をひかないように、暖かくして寝てね。=为了不感冒，穿暖和点睡哦。"},
{j:"もし時間に余裕があれば、帰りに温泉に寄ってもいいし、無理そうなら真っすぐ帰ってもいいし。",z:"如果时间充裕，回程顺路泡个温泉也行；看着来不及，直接回家也行。",
p:"もし|如果;時間(じかん)|时间;*に|在…方面;余裕(よゆう)|富余;*が|主语;あれば|有的话;帰り(かえり)|回程;*に|时候;温泉(おんせん)|温泉;*に|顺路去的地点;寄っても(よっても)|顺路去也;いい|行;*し|列举;無理(むり)|勉强;そう|看起来;なら|的话;真っすぐ(まっすぐ)|直接;帰っても(かえっても)|回去也;いい|行;*し|列举",

d:"電話してもいいし、メールでもいいし、都合のいい方法で連絡してね。=打电话也行，发邮件也行，用你方便的方式联系我。;この店は安いし、おいしいし、最高です。=这家店又便宜又好吃，最棒了。;今日は疲れたし、早く寝よう。=今天也累了，早点睡吧。"},
{j:"この前話してた旅行の件、みんなの予定がなかなか合わなくて、結局延期になっちゃった。",z:"之前说的旅行那事，大家时间一直凑不上，最后延期了。",

e:"朋友之间报告结果。话题直接放句首（「旅行の件、」），口语里常省略「は」。「なかなか〜ない」＝怎么也不…。「〜になっちゃった」＝结果变成了…（遗憾）。",
d:"雨のせいで、試合は結局中止になっちゃった。=因为下雨，比赛最后取消了。;いいアイデアがなかなか浮かばない。=怎么也想不出好主意。;結局、誰も来なかった。=结果谁都没来。"},
{j:"子どもの頃からずっと行ってみたかった場所なので、今回の旅行が楽しみで仕方がないです。",z:"那是我从小就一直想去的地方，所以超级期待这次旅行。",
p:"子ども(こども)|孩子;*の|的;頃(ころ)|时候;*から|从;ずっと|一直;行って(いって)|去;みたかった|曾想试试;場所(ばしょ)|地方;なので|因为是;今回(こんかい)|这次;*の|的;旅行(りょこう)|旅行;*が|主语;楽しみ(たのしみ)|期待;*で|て形;仕方がない(しかたがない)|…得不得了;です|是",
t:"〜て仕方がない",

<script>
// ───────── utils
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PUNCT = /[、。？！,.!?\s「」…・]/g;
const store = {
  get(k, d) { try { const v = localStorage.getItem("jp100v2:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("jp100v2:" + k, JSON.stringify(v)); } catch {} }
};

// ───────── data prep
S.forEach((s, i) => {
  s.id = i; s.scene = Math.floor(i / 10);
  s.parts = s.p.split(";").map(x => {
    const [w, g] = x.split("|"); const isp = w.startsWith("*");
    const m = w.replace(/^\*/, "").match(/^(.+?)(?:\((.+)\))?$/);
    return { w: m[1], r: m[2] || "", g, isp };
  });
  s.drills = s.d.split(";").map(x => { const [j, z] = x.split("="); return { j, z }; });
  s.kana = s.parts.map(p => p.r || p.w).join("");
});

let progress = store.get("progress", {});
let showFuri = store.get("furi", true);
const status = id => progress[id] || 0;
function setStatus(id, v) { progress[id] = v; store.set("progress", progress); }

// ───────── capabilities (Claude)
let sampleCap = null, ttsCap = null, dictCap = null;
if (window.claude && claude.use) {
  claude.use("sample").then(x => { sampleCap = x; refreshAI(); });
  claude.use("tts").then(x => { ttsCap = x; });
  claude.use("dictation").then(x => { dictCap = x; setupDictation(); refreshAI(); });
}
function refreshAI() { document.querySelectorAll("[data-needs-ai]").forEach(el => el.style.display = sampleCap ? "" : "none");
  document.querySelectorAll("[data-no-ai]").forEach(el => el.style.display = sampleCap ? "none" : "");
  document.querySelectorAll(".mic").forEach(el => el.style.display = dictCap ? "" : "none"); }

// ───────── speech
let jaVoice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); jaVoice = vs.find(v => /ja[-_]JP/i.test(v.lang) && /Kyoko|Otoya|Google|Nanami|Haruka/i.test(v.name)) || vs.find(v => /^ja/i.test(v.lang)) || null; } catch {} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch {}
// recorded audio bundles (one per scene), keyed s{id} / d{id}_{k}
const AUD = {}, AUDLOAD = {}, TEXTKEY = {};
S.forEach(s => { TEXTKEY[s.j] = "s" + s.id; s.drills.forEach((d, k) => TEXTKEY[d.j] = `d${s.id}_${k}`); });
function loadScene(i) {
  if (AUD[i]) return Promise.resolve(AUD[i]);
  if (window.AUDIO_INLINE && AUDIO_INLINE[i]) { AUD[i] = AUDIO_INLINE[i]; return Promise.resolve(AUD[i]); }
  if (!AUDLOAD[i]) AUDLOAD[i] = fetch(`a${i}.json`).then(r => { if (!r.ok) throw 0; return r.json(); }).then(j => (AUD[i] = j)).catch(() => { delete AUDLOAD[i]; return null; });
  return AUDLOAD[i];
}
let curAudio = null;
function playClip(b64, slow, mime) {
  try { if (curAudio) curAudio.pause(); } catch {}
  const a = new Audio("data:" + (mime || "audio/mpeg") + ";base64," + b64);
  a.playbackRate = slow ? 0.7 : 1; try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch {}
  curAudio = a; return a.play();
}
function speak(text, slow) {
  text = String(text);
  const key = TEXTKEY[text];
  if (key) {
    const sc = Math.floor(parseInt(key.slice(1)) / 10);
    if (AUD[sc]) { playClip(AUD[sc][key], slow, AUD[sc]._mime).catch(() => {}); return; }
    loadScene(sc).then(b => { if (b) playClip(b[key], slow, b._mime).catch(() => {}); });
    return;
  }
  text = text.replace(/[（(].*?[)）]/g, "");
  if (jaVoice || !ttsCap) {

    const hist = store.get("rec" + s.id, []); hist.push(r.total); store.set("rec" + s.id, hist.slice(-10));
    const h = $("#recHist"); if (h) h.innerHTML = recHistHTML(s);
  } catch (e) { out.innerHTML = `<div class="result bad">${esc(e.msg || "分析失败，请换一段录音再试。")}</div>`; }
}
function recHistHTML(s) { const h = store.get("rec" + s.id, []); return h.length ? `最近得分：${h.map((x, i) => i === h.length - 1 ? `<b>${x}</b>` : x).join(" → ")}` : ""; }
const CAN_LIVE = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) && (() => { try { return window.self === window.top; } catch { return false; } })();
let recorder = null, recTimer = null;
async function liveToggle(btn, s) {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } }); }
  catch (e) { $("#recRes").innerHTML = `<div class="result bad">用不了麦克风。请在 设置 → Safari（或这个App）里允许麦克风，或者改用下面的“选录音文件”。</div>`; return; }
  try { if (curAudio) curAudio.pause(); } catch {}
  const mt = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => { try { return MediaRecorder.isTypeSupported(t); } catch { return false; } }) || "";
  const chunks = [];
  recorder = new MediaRecorder(stream, mt ? { mimeType: mt } : undefined);
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); clearTimeout(recTimer);
    btn.classList.remove("live"); btn.innerHTML = "🎙 开始录音";
    const blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || mt || "audio/mp4" }); recorder = null;
    analyzeRecording(blob, s, $("#recRes"));
  };
  recorder.start(); btn.classList.add("live"); btn.innerHTML = "⏹ 说完了，点这里";
  $("#recRes").innerHTML = `<div class="result mid">🔴 正在录音…说完这一句就点按钮（最长 15 秒）</div>`;
  recTimer = setTimeout(() => { if (recorder && recorder.state === "recording") recorder.stop(); }, 15000);
}
function recUI(s) {
  const live = CAN_LIVE ? `<button class="btn pri recbtn" id="liveRec">🎙 开始录音</button><label class="btn">📁 选录音文件<input type="file" accept="audio/*,video/*" data-rec hidden></label>`
    : `<label class="btn pri">📹 录音<input type="file" accept="video/*,audio/*" capture="user" data-rec hidden></label><label class="btn">📁 选录音文件<input type="file" accept="audio/*,video/*" data-rec hidden></label>`;
  const hint = CAN_LIVE ? "点“开始录音”，说完这一句再点一下，马上出分。"
    : "iPhone 点“录音”会打开相机录像——只用声音，画面随便。录完点「使用视频」就开始分析。安装到主屏幕的离线版可以直接录音。";
  return `<div class="lbl" style="margin-top:16px">🎙 录音打分 · 先听原声，再录下你说的这一句</div>
  <div class="row">${live}</div><div class="hint">${hint}</div>
  <div class="muted" id="recHist" style="font-size:13px">${recHistHTML(s)}</div><div id="recRes"></div>`;
}
function bindRec(el, s) {
  el.querySelectorAll("[data-rec]").forEach(inp => inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) analyzeRecording(f, s, $("#recRes")); inp.value = ""; });
  const lb = el.querySelector("#liveRec"); if (lb) lb.onclick = () => liveToggle(lb, s);
}

// ───────── offline (PWA)
const IN_FRAME = (() => { try { return window.self !== window.top; } catch { return true; } })();
const STANDALONE = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let offlineState = "";
if (!IN_FRAME && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").then(() => checkOffline()).catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data === "cached") { offlineState = "ready"; updateOfflineBox(); } });
}
async function checkOffline() {
  try { const keys = await caches.keys(); for (const k of keys) { const c = await caches.open(k); const r = await c.match("a9.json"); if (r) { offlineState = "ready"; break; } } if (!offlineState) offlineState = "loading"; } catch { }
  updateOfflineBox();
}
function updateOfflineBox() {
  const el = document.getElementById("offlineBox"); if (!el || IN_FRAME) return;
  let h = "";
  if (window.AUDIO_INLINE) h = `<div class="box muted" style="font-size:13px">💾 这是电脑离线版，断网也能用。</div>`;
  else if (offlineState === "ready") h = `<div class="box" style="font-size:13px;background:var(--green-soft)">✅ 离线包已就绪：断网也能用（音频和录音打分都在本机）。</div>`;
  else if (offlineState === "loading") h = `<div class="box muted" style="font-size:13px">⏳ 正在下载离线包（约 10MB），请保持联网一会儿…</div>`;
  if (IS_IOS && !STANDALONE && !window.AUDIO_INLINE) h += `<div class="box" style="font-size:14px">📲 <b>安装到手机</b>：点 Safari 底部的「分享」按钮 → 「添加到主屏幕」。之后从主屏幕图标打开，断网也能用，还能直接录音。</div>`;
  el.innerHTML = h;
}

let navStack = [];
function go(v, push = true) { if (push) navStack.push(view); view = v; render(); window.scrollTo(0, 0); }
$("#back").onclick = () => { if (navStack.length) { view = navStack.pop(); render(); window.scrollTo(0, 0); } };

function setTop(title, back = true) { $("#title").textContent = title; $("#back").style.visibility = back ? "visible" : "hidden"; $("#furi").classList.toggle("on", showFuri); }

}

function tabOrder(el, s) {
  let chunks = s.parts.map((p, i) => ({ ...p, k: i }));
  let pool = shuffle(chunks); let tries = 0;
  while (pool.map(c => c.w).join("") === chunks.map(c => c.w).join("") && tries++ < 10) pool = shuffle(chunks);
  let ans = [];
  el.innerHTML = `<div class="box"><div class="lbl">按日语语序排列（橙色是助词）</div><div class="zh" style="font-size:17px;color:var(--ink)">${esc(s.z)}</div>
    <div class="answer" id="ans"></div><div class="pool" id="pool"></div>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="chk">检查</button><button class="btn" id="rst">重来</button></div><div id="res"></div></div>
  <div class="box muted">🧠 记住日语的骨架：<b>时间 → 地点 → 对象＋助词 → 动词</b>，动词和“是不是”的判断永远在最后。</div>`;
  const draw = () => {
    $("#ans").innerHTML = ans.map((c, i) => `<button class="chip jp ${c.isp ? "isp" : ""}" data-a="${i}">${esc(c.w)}</button>`).join("") || `<span class="muted">点下面的词块，按顺序排在这里</span>`;
    $("#pool").innerHTML = pool.map((c, i) => `<button class="chip jp ${c.isp ? "isp" : ""}" data-p="${i}">${esc(c.w)}</button>`).join("");
    el.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { ans.push(pool.splice(+b.dataset.p, 1)[0]); $("#res").innerHTML = ""; draw(); });
    el.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { pool.push(ans.splice(+b.dataset.a, 1)[0]); $("#res").innerHTML = ""; draw(); });
  };
  draw();
  $("#rst").onclick = () => { pool = shuffle(chunks); ans = []; $("#res").innerHTML = ""; draw(); };
  $("#chk").onclick = () => {
    if (pool.length) { $("#res").innerHTML = `<div class="result mid">还有 ${pool.length} 个词块没用上。</div>`; return; }
    const mine = ans.map(c => c.w).join(""), right = chunks.map(c => c.w).join("");
    if (mine === right) {
      $("#res").innerHTML = `<div class="result good">🎉 完全正确！现在不看屏幕，大声说三遍：<div class="row" style="margin-top:6px"><b class="jp">${esc(s.j)}</b>${miniPlay(s.j)}</div></div>`;
      speak(s.j);
    } else {
      el.querySelectorAll("[data-a]").forEach((b, i) => { if (ans[i].w !== chunks[i].w) b.classList.add("bad"); });
      $("#res").innerHTML = `<div class="result bad">顺序不对（红框处）。正确答案：<div class="row" style="margin-top:6px"><b class="jp">${esc(s.j)}</b>${miniPlay(s.j)}</div>
      <div data-needs-ai style="margin-top:10px"><button class="btn" id="askOrder">🤔 我的顺序也说得通吗？问 Claude</button><div id="askOut"></div></div></div>`;
      refreshAI();
      const ab = $("#askOrder"); if (ab) ab.onclick = () => runCorrect(ab, $("#askOut"), s, "把打乱的词块排成正确语序。请判断学生的语序在日语里是否也成立，如果不成立，解释日语语序规则。", ans.map(c => c.w).join(" "), s.j);
    }
  };
}

        <div style="margin-top:10px">${inputBox("qIn", "先说出来，再写下来…")}</div>
        <div class="row"><button class="btn pri" id="qB">提交批改</button><button class="btn" id="qShow">看参考答案</button></div><div id="qAns"></div><div id="qOut"></div></div>`;
      $("#qBox").querySelectorAll(".mic").forEach(m => m.onclick = () => micToggle(m));
      $("#qShow").onclick = () => $("#qAns").innerHTML = `<div class="result good"><div class="row"><b class="jp">${esc(q.answer)}</b>${miniPlay(q.answer)}</div></div>`;
      $("#qB").onclick = () => runCorrect($("#qB"), $("#qOut"), s, `把中文「${q.zh}」说成日语（练习句型${s.t}）。`, $("#qIn").value, q.answer);
    } catch (e) { $("#qBox").innerHTML = `<div class="result bad">${esc(errMsg(e))}</div>`; }
    b.disabled = false; b.innerHTML = "再出一道";
  };
}

// ───────── review
let rev = null;
function renderReview(app) {
  setTop("快速复习"); setFoot("");
  if (!rev || view.fresh) {
    let pool = S.filter(s => status(s.id) >= 1);
    if (pool.length < 10) pool = pool.concat(S.filter(s => status(s.id) === 0).slice(0, 10 - pool.length));
    const weak = pool.filter(s => status(s.id) === 1);
    rev = { list: shuffle(weak).concat(shuffle(pool.filter(s => status(s.id) !== 1))).slice(0, 10), i: 0, show: false, ok: 0 };
    rev.list = shuffle(rev.list); view.fresh = false;
  }
  if (rev.i >= rev.list.length) {
    app.innerHTML = `<div class="box revcard"><div style="font-size:40px">🎌</div><div class="zhq">这一轮完成！</div><p>脱口而出 ${rev.ok} / ${rev.list.length} 句</p>
      <div class="row" style="justify-content:center"><button class="btn pri" id="again">再来一轮</button><button class="btn" id="home">回首页</button></div></div>`;
    $("#again").onclick = () => { rev = null; render(); }; $("#home").onclick = () => { navStack = []; view = { name: "home" }; rev = null; render(); };
    return;
  }
  const s = rev.list[rev.i]; loadScene(s.scene);
  app.innerHTML = `<div class="prog">${rev.i + 1} / ${rev.list.length}</div><div class="box revcard"><div class="muted">${esc(SCENES[s.scene].name)} · 用日语说：</div><div class="zhq">${esc(s.z)}</div>
    ${rev.show ? `<div style="margin-top:14px">${sentenceHTML(s)}</div><div class="row" style="justify-content:center;margin-top:8px">${playBtns(s.j)}</div>
      <div class="row" style="justify-content:center;margin-top:18px"><button class="btn ok" id="yes">✓ 说出来了</button><button class="btn" id="no">✗ 卡住了</button></div>`
    : `<p class="muted" style="margin-top:18px">先大声说出来，再看答案</p><button class="btn pri" id="reveal">说完了，看答案</button>`}</div>
    <div class="muted" style="text-align:center">“卡住了”的句子会标成学习中，下次复习优先出现。</div>`;
  if (!rev.show) $("#reveal").onclick = () => { rev.show = true; render(); speak(s.j); };
  else {
    $("#yes").onclick = () => { rev.ok++; rev.i++; rev.show = false; render(); };
    $("#no").onclick = () => { setStatus(s.id, 1); rev.i++; rev.show = false; render(); };
  }
}

// ───────── chat (role-play)
const chats = {};
function chatSystem(i) {
  const sc = SCENES[i];
  return `你在一个日语口语情景对话练习中扮演：${sc.role}。场景主题：${sc.name}。
${STUDENT}
用自然、简单（N3难度）的日语和学生对话。每次只说1～2个短句，推动情景往前发展，并创造机会让学生用上这些句子：
${S.slice(i * 10, i * 10 + 10).map(s => "・" + s.j).join("\n")}
学生如果说了中文或说不出来，就在fix里告诉他日语怎么说，然后继续对话。对话进行到8轮左右可以自然地结束。
每次回复只输出一个JSON对象，不要任何其他文字：
{"feedback":"用中文简短点评学生上一句（重点是语序、助词、是否自然、礼貌程度是否合适）；说得好就具体夸一句；学生还没说话时为空字符串","fix":"学生上一句的正确或更自然的日语说法；完全没问题则为空字符串","reply":"你作为角色说的日语","reading":"reply的全平假名","zh":"reply的中文翻译"}`;
}
function renderChat(app) {
  const i = view.i, sc = SCENES[i]; setTop(`💬 ${sc.name}`); setFoot("");
  const c = chats[i] || (chats[i] = { msgs: [], view: [], busy: false, started: false });
  if (!sampleCap) { app.innerHTML = `<div class="box">在 Claude 里打开这个页面，就可以和 Claude 进行情景对话。</div>`; return; }
  app.innerHTML = `<div class="box muted" style="font-size:13px">Claude 扮演：${esc(sc.role)}。你用日语回应（说不出来也可以先打中文，它会教你怎么说）。</div>
   <div class="chat" id="chat"></div>
   <div class="box" style="position:sticky;bottom:10px">${inputBox("chatIn", "用日语回答…")}<div class="row"><button class="btn pri" id="send">发送</button><button class="btn" id="restart">重新开始</button></div></div>`;
  const draw = () => {
    $("#chat").innerHTML = c.view.map(m => m.who === "c" ? `<div class="bub c"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="jp" style="flex:1">${esc(m.reply)}</span>${miniPlay(m.reply)}</div>${showFuri ? `<div class="rd jp">${esc(m.reading)}</div>` : ""}<div class="tr">${esc(m.zh)}</div></div>`
      : m.who === "u" ? `<div class="bub u jp">${esc(m.text)}</div>`
      : m.who === "f" ? `<div class="fbk">${m.fix ? `<div class="row" style="flex-wrap:nowrap"><b class="jp" style="flex:1">✏️ ${esc(m.fix)}</b>${miniPlay(m.fix)}</div>` : ""}${esc(m.feedback)}</div>`
      : `<div class="muted">${m.text}</div>`).join("") + (c.busy ? `<div class="muted"><span class="spin"></span> 对方正在输入…</div>` : "");
  };
  const step = async (userText) => {
    c.busy = true;
    if (userText) { c.msgs.push({ role: "user", content: "学生说：" + userText }); c.view.push({ who: "u", text: userText }); }
    draw();
    try {
      const r = await sampleCap(c.msgs, { cache: false }); const j = parseJSON(r.text);
      c.msgs.push({ role: "assistant", content: r.text });
      if (userText && (j.feedback || j.fix)) c.view.push({ who: "f", fix: j.fix, feedback: j.feedback });
      c.view.push({ who: "c", reply: j.reply, reading: j.reading, zh: j.zh }); speak(j.reply);
    } catch (e) { if (userText) { c.msgs.pop(); } c.view.push({ who: "e", text: esc(errMsg(e)) }); }
    c.busy = false; if (view.name === "chat" && view.i === i) { draw(); window.scrollTo(0, document.body.scrollHeight); }
  };
  draw();
  if (!c.started) { c.started = true; c.msgs = [{ role: "user", content: chatSystem(i) + "\n\n现在请你先开口说第一句。" }]; step(); }
  app.querySelectorAll(".mic").forEach(m => m.onclick = () => micToggle(m));
  $("#send").onclick = () => { const v = $("#chatIn").value.trim(); if (!v || c.busy) return; $("#chatIn").value = ""; step(v); };
  $("#restart").onclick = () => { delete chats[i]; render(); };
}

// ───────── guides
function renderGuide(app) {
  setFoot("");
  if (view.which === "method") {
    setTop("怎么用效果最好");
    app.innerHTML = [
      ["① 学习：听 → 拆 → 懂", "先播放整句，再看逐词拆解。重点看橙色的助词：它决定了每个词在句子里的角色。然后跟读 5 遍（点圆圈计数），慢速模仿语调。"],
      ["② 语序：用手排一遍", "把打乱的词块排回去。你的问题是“语序颠三倒四”，所以这一步一定不要跳过。记住骨架：时间 → 地点 → 对象＋助词 → 动词放最后。"],
      ["③ 说说看：只看中文，逼自己开口", "这是“听得懂说不出”的解药。先大声说，再输入（可以用手机日语键盘的语音输入），然后对照答案或让 Claude 批改。"],
      ["④ 举一反三：换个内容再说", "先做 3 道替换题，然后用同一个句型说一句你自己生活里的话，让 Claude 检查；再让 Claude 出新题。能用句型说新的话，才是真正掌握。"],
      ["🔁 每天：复习 + 情景对话", "每天花 5 分钟做一轮快速复习，卡住的句子会自动回到“学习中”。每学完一个场景，就和 Claude 来一次情景对话，把 10 句串起来用。"],
      ["节奏建议", "每天 3～5 句，按 ①→④ 走完，再做一轮复习。一个月左右就能把 100 句全部练到脱口而出。"]
    ].map(([h, p]) => `<div class="box guide"><h3>${h}</h3><p>${p}</p></div>`).join("");
    return;
  }
  setTop("中国人常见的发音问题");
  const items = [
    ["长音要拖够", "日语每个假名占一拍，长音多一拍。拖不够，意思就变了。", "おばさん（阿姨）↔ おばあさん（奶奶）<br>ここ（这里）↔ こうこう（高中）"],
    ["促音「っ」是停顿一拍", "不要直接跳过，在「っ」的位置憋住一拍再发下一个音。", "きて（来）↔ きって（邮票）<br>なってきました"],
    ["「ん」也占一拍", "「ん」后面不要加 g 或 n 的鼻音尾巴，也要占满一拍。", "さいきん・せんせい・こんにちは"],
    ["清音不送气、浊音要震动", "日语「た・か・ぱ」在词中几乎不送气，听起来像中文的“哒、嘎、吧”；「だ・が・ば」要声带振动，中文没有这种音，摸着喉咙练。", "たいがく ✗ → だいがく（大学）<br>てんき（天气）"],
    ["句尾不要上扬", "陈述句句尾下降，只有疑问句才上扬。很多中国人习惯句尾拖高，听起来像在提问。", "そうですね↘（同意） ／ そうですか↗（疑问）"],
    ["「す」「し」的元音清化", "「です・ます」的「す」，「し・ち・つ」在清辅音之间，元音几乎不发出声。", "です → des　します → shimas<br>失礼します → shitsureishimas"],
    ["「つ」和「ず」", "「つ」是 ts，舌尖顶住齿龈再放开，不是拼音的 cu 或 zu。", "つかれ・つくえ・いつ"],
    ["日语的 r", "舌尖轻轻弹一下上齿龈，介于 l 和 d 之间，不要卷舌。", "りょうり・ありがとう・れんらく"],
    ["音高重音", "日语靠音的高低区分词义，不是中文的四声。每个词只有一处“下降”。播放时注意听哪里降下来。", "はし↘（筷子） ／ はし↗（桥） ／ はし（端）"]
  ];
  app.innerHTML = `<div class="box muted">练习方法：用“🐢 慢速”听，录下自己的声音（手机录音机）对比；或用手机日语键盘的语音输入说一遍——能被准确识别，说明发音没问题。</div>` +
    items.map(([h, p, ex]) => `<div class="box guide"><h3>${h}</h3><p>${p}</p><div class="ex">${ex}</div></div>`).join("");
}

// ───────── global click: play buttons
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); speak(b.dataset.say, !!b.dataset.slow); } }, true);
render();
</script>
